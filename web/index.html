<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>GrepMesh — Files</title><link rel="stylesheet" href="/ui/console.css?v=file-editor-20261021a">
</head>
<body class="finder-app">
<main class="finder-window">
  <aside class="finder-sidebar" aria-label="Sidebar">
    <div class="sidebar-brand"><span class="brand-mark">⌘</span><strong>GrepMesh</strong></div>
    <div class="sidebar-scroll">
      <h2 class="section-label">Bookmarks</h2><div id="bookmarks-sidebar" class="locations-sidebar"></div>
      <h2 class="section-label">Devices</h2><div id="host-sidebar" class="host-sidebar"></div>
      <h2 class="section-label">Locations</h2><div id="locations-sidebar" class="locations-sidebar"></div>
    </div>
    <div class="sidebar-footer">
      <button id="refresh-catalog" class="icon-button" title="Refresh hosts and index status" aria-label="Refresh hosts and index status">↻</button>
      <button id="show-telemetry" class="sidebar-link" type="button">◷ Search history</button>
      <a href="/ui/settings" class="icon-button" title="Settings" aria-label="Settings">⚙</a>
    </div>
  </aside>
  <section class="finder-browser" aria-label="Files">
    <header class="finder-toolbar">
      <div class="navigation-buttons"><button id="go-back" class="icon-button" aria-label="Back" title="Back" disabled>‹</button><button id="go-forward" class="icon-button" aria-label="Forward" title="Forward" disabled>›</button></div>
      <h1 id="browser-heading">All Devices</h1>
      <button id="bookmark-current" class="icon-button" aria-label="Bookmark current folder" title="Bookmark current folder" disabled>☆</button>
      <button id="toggle-inspector" class="icon-button" aria-label="Toggle details" title="Toggle details">ⓘ</button>
    </header>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current path"></nav>
    <form id="search-form" class="toolbar-search" novalidate>
      <label class="sr-only" for="query">Search text or pattern</label><span aria-hidden="true">⌕</span>
      <input id="query" name="query" type="search" autocomplete="off" placeholder="Search text or pattern in this location">
      <button id="search-button" class="quiet-button" type="submit"><span>Search</span></button>
    </form>
    <div class="file-table" id="file-table">
      <div class="list-header" role="row">
        <button type="button" data-sort="name" aria-sort="ascending">Name <span>⌃</span></button>
        <button type="button" data-sort="size">Size <span></span></button>
        <button type="button" data-sort="modified">Modified <span></span></button>
        <button type="button" data-sort="created">Created <span></span></button>
        <span>Kind</span>
      </div>
      <div id="results" class="results finder-list" aria-live="polite"></div>
    </div>
    <details id="host-failures" class="host-failures" hidden></details>
    <section id="telemetry-panel" class="telemetry-panel" hidden aria-label="Search history"><div class="history-heading"><h2>Search history</h2><button id="close-telemetry" class="quiet-button">Back to files</button></div><p id="telemetry-retention" class="muted"></p><div id="telemetry-records"></div></section>
    <footer class="browser-status"><span id="results-count">Choose a location</span><div id="search-state" class="search-state idle" role="status"><span class="state-dot"></span><span>Ready</span></div></footer>
  </section>
  <aside class="finder-details" aria-label="Details">
    <div class="inspector-toolbar">ⓘ <span>Details</span><div id="connection" class="connection" role="status"><span class="pulse"></span><span>Connecting…</span></div></div>
    <nav id="match-navigation" class="match-navigation" aria-label="Matches in selected file" hidden>
      <button id="previous-match" class="quiet-button" type="button" aria-label="Previous match">‹ Prev</button>
      <span id="match-position" role="status" aria-live="polite"></span>
      <button id="next-match" class="quiet-button" type="button" aria-label="Next match">Next ›</button>
    </nav>
    <section class="inspector"><div id="preview" class="preview-empty"><span class="file-icon folder large"></span><p>Select a file or folder</p><small>Details appear here</small></div></section>
    <section id="host-detail" class="host-detail" aria-label="Host index"></section>
    <details class="backup-card"><summary>Backup catalog <span id="backup-badge" class="backup-state">Checking…</span></summary><div id="backup-body" class="backup-body"></div></details>
  </aside>
</main>
<dialog id="file-editor-dialog" class="file-editor-dialog" aria-labelledby="file-editor-title">
  <header class="file-editor-header"><div><span class="file-editor-kicker">GrepMesh file view</span><h2 id="file-editor-title">File preview</h2></div><button id="file-editor-close" class="icon-button" type="button" aria-label="Close file view">✕</button></header>
  <div class="file-editor-layout"><aside id="file-editor-sidebar" class="file-editor-sidebar"></aside><section id="file-editor-main" class="file-editor-main" aria-label="File contents"></section></div>
</dialog>
<script src="/ui/markdown-it.js?v=15.0.3" defer></script>
<script src="/ui/console.js?v=file-editor-20261021a" defer></script>
</body></html>
