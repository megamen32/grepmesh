name: Build release assets

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary: target/release/grepmesh-mcp
          - runner: macos-13
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            binary: target/release/grepmesh-mcp
          - runner: macos-14
            target: macos-aarch64
            rust_target: aarch64-apple-darwin
            binary: target/release/grepmesh-mcp
          - runner: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            binary: target/release/grepmesh-mcp.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build GrepMesh
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.rust_target }}"
      - name: Build ripgrep
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo install ripgrep --locked
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/BurntSushi/ripgrep/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match 'x86_64-pc-windows-msvc.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'ripgrep Windows release asset not found' }
          Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile rg.zip
          Expand-Archive rg.zip rg-release
          $rg = Get-ChildItem rg-release -Recurse -Filter rg.exe | Select-Object -First 1
          $rgPath = "$env:USERPROFILE\.cargo\bin\rg.exe"
          Copy-Item $rg.FullName $rgPath
          if (-not (Test-Path -LiteralPath $rgPath)) { throw 'ripgrep installation did not provide rg.exe' }
          "RG_BIN=$rgPath" >> $env:GITHUB_ENV
      - name: Package platform bundle
        shell: bash
        run: |
          python3 scripts/package-release.py \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.rust_target }}/release/$(basename '${{ matrix.binary }}')" \
            --rg "${RG_BIN:-$(command -v rg)}" \
            --output dist
      - name: Smoke packaged MCP and search
        shell: bash
        run: |
          python3 scripts/smoke-release.py \
            --target "${{ matrix.target }}" \
            --archive "dist/grepmesh-${{ matrix.target }}${{ startsWith(matrix.target, 'windows-') && '.zip' || '.tar.gz' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/grepmesh-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum grepmesh-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
